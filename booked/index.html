<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're booked. VoiceClaw.</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ground:#090E1F;--line:rgba(107,114,128,.28);--ink:#F6F7F4;--ink-2:#C9CED6;--muted:#6B7280;--accent:#C8FF1A;--glow:rgba(200,255,26,.45)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{height:30px;display:block;margin:0 auto 48px}
  .kicker{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;font-weight:500}
  h1{margin:0 0 16px;font-weight:500;letter-spacing:-.025em;font-size:clamp(34px,6vw,52px);line-height:1.08;text-wrap:balance}
  p{margin:0 auto 10px;color:var(--ink-2);max-width:34ch;text-wrap:pretty}
  a{color:var(--ink-2);border-bottom:1px solid var(--line)}
  small{display:block;margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<a href="/" style="border:0"><img src="/assets/voiceclaw-logo.svg" alt="VoiceClaw"></a>
<span class="kicker">Call booked</span>
<h1>You're booked. Ian will see you then.</h1>
<p>The invite and the call link are in your email. Need to change the time? Use the link in that email.</p>
<small>VoiceClaw Inc. · Ontario, Canada · <a href="/privacy/">Privacy</a></small>

<!-- Cal.com sends people here only after a booking is confirmed, so this page reports one booking to Meta (Schedule) and PostHog. -->
<script src="/assets/measure.js?v=1"></script>
<script>
  fbq('track', 'Schedule');
  posthog.capture('booked_call');
</script>
</body>
</html>
